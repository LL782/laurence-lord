name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.0.0
          run_install: true

      - name: Install dependencies
        run: pnpm ci

      - name: Build
        run: pnpm test

      - name: Check
        run: pnpm check
